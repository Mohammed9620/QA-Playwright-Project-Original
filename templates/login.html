<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — QA Automation Engine</title>
  <meta name="description" content="Sign in to the QA Automation Engine dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    /* ════════════════════════════════════════════════════════════
       LOGIN — Page-specific styles
       ════════════════════════════════════════════════════════════ */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    /* ── Brand mark ── */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      text-align: center;
    }
    .login-brand-icon {
      width: 48px;
      height: 48px;
      background: var(--bg-cards);
      border: 1px solid var(--control-bg);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }
    .login-brand-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .login-brand-sub {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ── Card surface ── */
    .login-surface {
      background: var(--bg-cards);
      border-radius: 24px;
      padding: 32px 24px;
    }

    /* ── Segmented Tab Controls ── */
    .tabs-container {
      position: relative;
      display: flex;
      background: var(--control-icon-bg);
      border-radius: 999px;
      padding: 3px;
      margin-bottom: 24px;
    }
    .tab-indicator {
      position: absolute;
      top: 3px; bottom: 3px; left: 0;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      transition: transform 200ms ease-out, width 200ms ease-out;
      z-index: 1;
      pointer-events: none;
    }
    [data-theme="light"] .tab-indicator { background: rgba(0, 0, 0, 0.08); }
    .tab-btn {
      flex: 1;
      position: relative;
      z-index: 2;
      padding: 8px 16px;
      border: none;
      background-color: transparent !important;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      transition: color 200ms ease-out;
    }
    .tab-btn.active { color: var(--text-primary); font-weight: 600; }
    .tab-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }

    /* ── Form group ── */
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .form-group input {
      padding: 0 16px;
      height: 48px;
      background: var(--control-bg);
      border: none;
      color: var(--text-primary);
      border-radius: 14px;
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: background 150ms ease-out;
    }
    .form-group input::placeholder { color: var(--text-tertiary); }
    .form-group input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

    /* ── Error banner ── */
    .error-banner { display: none; }
    .error-banner.visible { display: flex; }

    /* ── Back link ── */
    .login-back {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .login-back a {
      color: var(--text-primary);
      text-decoration: none;
    }
    .login-back a:hover { text-decoration: underline; }

    /* Mascot removed to meet clean styling. */
  </style>
</head>

<body>
  <canvas id="smoke-bg" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1;"></canvas>
  <main class="login-wrapper">
    <div class="login-brand">
      <div class="login-brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="M9 12l2 2 4-4" />
        </svg>
      </div>
      <h1 class="login-brand-title">QA Automation Engine</h1>
      <span class="login-brand-sub">Sign in to continue</span>
    </div>

    <div class="login-surface">
      <div class="tabs-container">
        <div class="tab-indicator" id="tab-indicator"></div>
        <button type="button" class="tab-btn active" id="user-tab">Login as User</button>
        <button type="button" class="tab-btn" id="admin-tab">Login as Admin</button>
      </div>

      {% if error %}
      <div class="error-banner visible" id="login-error" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="login-error-text">{{ error }}</span>
      </div>
      {% else %}
      <div class="error-banner" id="login-error" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="login-error-text">Invalid username or password.</span>
      </div>
      {% endif %}

      <form id="login-form" method="POST" action="/login" novalidate>
        <input type="hidden" name="role" id="role-hidden-input" value="user">

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Username or Email" autocomplete="username" spellcheck="false" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 24px;" id="login-btn">
          Sign in
        </button>
      </form>
    </div>
  </main>

  <script>
    function switchTab(role) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(role + '-tab');
      if (activeBtn) {
        activeBtn.classList.add('active');
        const indicator = document.getElementById('tab-indicator');
        if (indicator) {
          indicator.style.transform = `translateX(${activeBtn.offsetLeft - 3}px)`;
          indicator.style.width = `${activeBtn.offsetWidth}px`;
        }
      }
      const usernameInput = document.querySelector('input[name="username"]');
      document.getElementById('role-hidden-input').value = role;
      if (role === 'admin') {
        if (usernameInput) usernameInput.placeholder = 'Admin Username';
      } else {
        if (usernameInput) usernameInput.placeholder = 'Username or Email';
      }
    }

    window.addEventListener('load', () => {
      const activeRole = document.getElementById('role-hidden-input').value || 'user';
      switchTab(activeRole);
    });
    window.addEventListener('resize', () => {
      const activeRole = document.getElementById('role-hidden-input').value || 'user';
      switchTab(activeRole);
    });

    document.getElementById('user-tab').addEventListener('click', () => switchTab('user'));
    document.getElementById('admin-tab').addEventListener('click', () => switchTab('admin'));

    document.getElementById("login-form").addEventListener("submit", (e) => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("login-error");
      const errText = document.getElementById("login-error-text");

      if (!username || !password) {
        e.preventDefault();
        errText.textContent = "Please enter both username and password.";
        errEl.classList.add("visible");
        return;
      }
      errEl.classList.remove("visible");
    });
  </script>

  <!-- ════════ WEBGL SMOKE SHADER ════════ -->
  <script>
    (function initSmokeBackground() {
      var canvas = document.getElementById('smoke-bg');
      if (!canvas) return;

      var gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false })
        || canvas.getContext('experimental-webgl', { alpha: false });
      if (!gl) {
        return;
      }

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = canvas.clientWidth * dpr;
        var h = canvas.clientHeight * dpr;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
      }
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(resize).observe(canvas);
      } else {
        window.addEventListener('resize', resize, { passive: true });
      }
      resize();

      var VERT = 'attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos,0.0,1.0); }';

      var FRAG = [
        'precision mediump float;',
        'uniform vec2 iResolution;',
        'uniform float iTime;',
        'uniform vec3 u_color;',
        '',
        'void mainImage(out vec4 fragColor, in vec2 fragCoord){',
        '    vec2 centeredUV = (2.0 * fragCoord - iResolution.xy) / min(iResolution.x, iResolution.y);',
        '    float time = iTime * 0.14;',
        '',
        '    // Autonomous smoke distortion loop',
        '    vec2 distortion = centeredUV;',
        '    for (int j = 1; j < 8; j++) {',
        '        float i = float(j);',
        '        distortion.x += 0.5 / i * cos(i * 2.0 * distortion.y + time);',
        '        distortion.y += 0.5 / i * cos(i * 2.0 * distortion.x + time);',
        '    }',
        '',
        '    float wave = abs(sin(distortion.x + distortion.y + time));',
        '    float glow = smoothstep(0.9, 0.2, wave);',
        '    vec3 bgColor = vec3(20.0/255.0, 16.0/255.0, 14.0/255.0);',
        '    float smokeAlpha = glow * 0.4;',
        '    fragColor = vec4(mix(bgColor, u_color, smokeAlpha), 1.0);',
        '}',
        '',
        'void main() {',
        '    mainImage(gl_FragColor, gl_FragCoord.xy);',
        '}'
      ].join('\n');

      function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.error('Smoke shader compile error:', gl.getShaderInfoLog(s));
          gl.deleteShader(s);
          return null;
        }
        return s;
      }

      var vs = compile(gl.VERTEX_SHADER, VERT);
      var fs = compile(gl.FRAGMENT_SHADER, FRAG);
      if (!vs || !fs) return;

      var prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, 'a_pos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      var uResolution = gl.getUniformLocation(prog, 'iResolution');
      var uTime       = gl.getUniformLocation(prog, 'iTime');
      var uColor      = gl.getUniformLocation(prog, 'u_color');

      var t0 = performance.now();
      var raf;

      function frame() {
        var elapsed = (performance.now() - t0) / 1000.0;
        gl.uniform2f(uResolution, canvas.width, canvas.height);
        gl.uniform1f(uTime, elapsed);
        // Soft white / light-gray smoke
        gl.uniform3f(uColor, 220.0 / 255.0, 220.0 / 255.0, 220.0 / 255.0);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);

      window.addEventListener('pagehide', function () {
        cancelAnimationFrame(raf);
      }, { once: true });
    })();
  </script>
</body>

</html>
